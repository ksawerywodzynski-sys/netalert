<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetAlert</title>
<style>
  :root { --bg:#10151a; --fg:#e8eef2; --muted:#8a98a3; --card:#1a222a; --ok:#2fbf71; --bad:#e5484d; --warn:#f5a524; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6f8; --fg:#14202a; --muted:#5b6b78; --card:#fff; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,-apple-system,sans-serif; }
  body.alarm { animation: flash 0.8s steps(2) infinite; }
  @keyframes flash { 50% { background:#5a0f12; } }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:16px; }
  button { font:inherit; padding:14px 18px; border:0; border-radius:10px; background:#2d6cdf; color:#fff; width:100%; margin-bottom:10px; }
  button.secondary { background:var(--card); color:var(--fg); border:1px solid var(--muted); }
  button.stop { background:var(--bad); font-size:20px; padding:20px; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:10px; border-left:6px solid var(--ok); }
  .card.captured { border-color:var(--bad); }
  .card.lost, .card.unarmed { border-color:var(--warn); }
  .card b { font-size:18px; }
  .state { font-weight:600; }
  canvas.chart { width:100%; height:130px; display:block; margin-top:8px; }
  #log { font:13px ui-monospace,monospace; color:var(--muted); white-space:pre-wrap; max-height:30vh; overflow:auto; }
  #msg { color:var(--warn); margin-bottom:10px; }
  .hidden { display:none; }
</style>
</head>
<body>
<h1>NetAlert</h1>
<div class="sub">Mist-net capture sensors. Tap Start, pick NetAlert, then keep this page open and the screen on.</div>
<div id="msg"></div>
<button id="start">Start listening</button>
<button id="testsound" class="secondary">Test sound (3 s)</button>
<button id="sim" class="secondary">Simulate a sensor (test the alarm)</button>
<button id="silence" class="stop hidden">SILENCE ALARM</button>
<div id="cards"></div>
<div id="log"></div>

<script>
// Packet format: must match firmware/src/main.c and receiver/protocol.py.
const COMPANY_ID = 0xFFFF;
const LOST_AFTER_S = 15;      // heartbeat is 1 s; BLE drops packets, 15 s of silence is a real problem
const CHART_WINDOW_S = 300;   // chart shows the last 5 minutes
const THRESHOLD_MPS2 = 1.0;   // must match DEVIATION_MPS2 in firmware/src/main.c
const SILENCE_S = 60;         // alarm stays quiet this long after you tap Silence, unless a new event occurs

function parse(dv) {
  if (dv.byteLength < 9 || dv.getUint8(0) !== 0x4E || dv.getUint8(1) !== 0x41) return null; // 'N','A'
  const flags = dv.getUint8(3);
  return { id: dv.getUint8(2), captured: !!(flags & 1), armed: !!(flags & 2),
           heartbeat: dv.getUint16(4, true), captures: dv.getUint16(6, true), peak: dv.getUint8(8) / 10,
           activity: dv.byteLength >= 10 ? dv.getUint8(9) / 10 : null };
}

const sensors = new Map();   // id -> {pkt, seen, lost, alarmedCapture}
let alarmUntil = 0, silencedUntil = 0, audio = null, wakeLock = null;
const $ = (id) => document.getElementById(id);

function log(msg) {
  const t = new Date().toLocaleTimeString();
  $('log').textContent = `${t}  ${msg}\n` + $('log').textContent;
}

function raiseAlarm(msg) {
  log('!!! ' + msg);
  alarmUntil = Infinity;               // sounds until acknowledged
  silencedUntil = 0;
  render();
}

function onPacket(p) {
  let s = sensors.get(p.id);
  if (!s) { s = { alarmedCapture: -1, lost: false }; sensors.set(p.id, s); log(`sensor ${p.id} found (armed=${p.armed})`); }
  s.pkt = p; s.seen = Date.now();
  if (p.activity !== null) {
    (s.hist = s.hist || []).push({ t: s.seen, v: p.activity, cap: p.captured });
    while (s.hist.length && s.seen - s.hist[0].t > CHART_WINDOW_S * 1000) s.hist.shift();
  }
  if (s.lost) { s.lost = false; log(`sensor ${p.id} back in range`); }
  if (p.captured && s.alarmedCapture !== p.captures) {
    s.alarmedCapture = p.captures;
    raiseAlarm(`CAPTURE on net ${p.id}! peak ${p.peak.toFixed(1)} m/s2`);
  }
  render();
}

setInterval(() => {
  const now = Date.now();
  for (const [id, s] of sensors) {
    if (!s.lost && now - s.seen > LOST_AFTER_S * 1000) {
      s.lost = true;
      raiseAlarm(`Net ${id} sensor SIGNAL LOST (out of range or dead battery)`);
    }
  }
}, 1000);

function render() {
  $('cards').innerHTML = '';
  for (const [id, s] of [...sensors].sort((a, b) => a[0] - b[0])) {
    const p = s.pkt;
    const state = s.lost ? 'SIGNAL LOST' : p.captured ? 'CAPTURE' : p.armed ? 'Armed, quiet' : 'Not armed yet';
    const cls = s.lost ? 'lost' : p.captured ? 'captured' : p.armed ? '' : 'unarmed';
    const age = Math.round((Date.now() - s.seen) / 1000);
    const d = document.createElement('div');
    d.className = 'card ' + cls;
    d.innerHTML = `<b>Net ${id}</b> <span class="state">${state}</span><br>` +
      `<span class="sub">last packet ${age}s ago · captures ${p.captures}${p.captured ? ' · peak ' + p.peak.toFixed(1) + ' m/s²' : ''}</span>`;
    $('cards').appendChild(d);
    if (s.hist && s.hist.length) {
      const c = document.createElement('canvas'); c.className = 'chart'; d.appendChild(c);
      drawChart(c, s.hist);
    }
  }
  const ringing = isRinging();
  document.body.classList.toggle('alarm', ringing);
  $('silence').classList.toggle('hidden', !(alarmUntil > Date.now()));
}
setInterval(render, 1000);

// Movement chart: max movement per second (m/s²) over the last 5 minutes, threshold line, capture shading.
function drawChart(canvas, hist) {
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const fg = css.getPropertyValue('--muted').trim(), bad = css.getPropertyValue('--bad').trim(), ok = css.getPropertyValue('--ok').trim(), warn = css.getPropertyValue('--warn').trim();
  const now = Date.now(), padL = 30, padB = 16, pw = w - padL - 4, ph = h - padB - 4;
  const ymax = Math.max(3, Math.ceil(Math.max(...hist.map((q) => q.v)) * 1.15));
  const X = (t) => padL + pw * (1 - (now - t) / (CHART_WINDOW_S * 1000));
  const Y = (v) => 4 + ph * (1 - v / ymax);
  g.font = '11px system-ui'; g.fillStyle = fg; g.strokeStyle = fg; g.lineWidth = 1;
  g.fillText(ymax, 2, 12); g.fillText('0', 14, 4 + ph); g.fillText('-5 min', padL, h - 3); g.fillText('now', w - 26, h - 3);
  g.globalAlpha = 0.25; g.beginPath(); g.moveTo(padL, 4 + ph); g.lineTo(w - 4, 4 + ph); g.stroke(); g.globalAlpha = 1;
  g.strokeStyle = warn; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(padL, Y(THRESHOLD_MPS2)); g.lineTo(w - 4, Y(THRESHOLD_MPS2)); g.stroke(); g.setLineDash([]);
  g.fillStyle = bad; g.globalAlpha = 0.18;
  for (let i = 0; i < hist.length; i++) if (hist[i].cap) { const x0 = X(hist[i].t), x1 = i + 1 < hist.length ? X(hist[i + 1].t) : w - 4; g.fillRect(x0, 4, Math.max(2, x1 - x0), ph); }
  g.globalAlpha = 1;
  g.strokeStyle = ok; g.lineWidth = 1.5; g.beginPath();
  hist.forEach((q, i) => { const x = X(q.t), y = Y(q.v); if (i === 0 || q.t - hist[i - 1].t > 3000) g.moveTo(x, y); else g.lineTo(x, y); });  // gap = no signal
  g.stroke();
}

// ---- Alarm sound ----
// A looping <audio> element, not Web Audio: iOS mutes Web Audio when the ringer switch is silent,
// but plays <audio> media. It must be started from a tap once to unlock it.
function makeAlarmWav() {
  const rate = 22050, secs = 1.0, n = Math.floor(rate * secs), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const f = i < n / 2 ? 1800 : 1200;                       // two alternating tones
    v.setInt16(44 + i * 2, (Math.sin(2 * Math.PI * f * i / rate) > 0 ? 1 : -1) * 0.8 * 32767, true);  // square wave
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
const alarmAudio = new Audio(makeAlarmWav());
alarmAudio.loop = true;
alarmAudio.setAttribute('playsinline', '');
let audioUnlocked = false;
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* optional */ }
  if (audioUnlocked) return;
  alarmAudio.play().then(() => { alarmAudio.pause(); alarmAudio.currentTime = 0; audioUnlocked = true; })
    .catch((e) => { $('msg').textContent = 'Sound blocked: ' + e.message; });
}
function isRinging() { return Date.now() >= silencedUntil && alarmUntil > Date.now(); }
setInterval(() => {
  if (isRinging()) {
    if (alarmAudio.paused) alarmAudio.play().catch(() => { $('msg').textContent = 'Tap "Test sound" to enable the alarm sound.'; });
    if (navigator.vibrate) navigator.vibrate(300);
  } else if (!alarmAudio.paused) {
    alarmAudio.pause();
  }
}, 500);

$('testsound').onclick = () => {
  unlockAudio(); alarmAudio.currentTime = 0;
  alarmAudio.play().then(() => setTimeout(() => { if (!isRinging()) alarmAudio.pause(); }, 3000))
    .catch((e) => { $('msg').textContent = 'Sound blocked: ' + e.message; });
};

$('silence').onclick = () => { silencedUntil = Date.now() + SILENCE_S * 1000; alarmUntil = 0; log('alarm silenced'); render(); };

// ---- Bluetooth ----
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* optional */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeLock) keepAwake(); });

const SVC = '4e41ff00-9d11-4c7f-8a1b-5c7d2e6f0001';   // must match firmware/src/main.c
const CHR = '4e41ff01-9d11-4c7f-8a1b-5c7d2e6f0001';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let device = null;

// Connect and subscribe. The board sends the same 9-byte packet once a second while connected.
async function connect() {
  const server = await device.gatt.connect();
  const chr = await (await server.getPrimaryService(SVC)).getCharacteristic(CHR);
  chr.addEventListener('characteristicvaluechanged', (e) => { const p = parse(e.target.value); if (p) onPacket(p); });
  await chr.startNotifications();
  const first = parse(await chr.readValue());
  if (first) onPacket(first);
}

async function reconnectLoop() {
  while (device && !device.gatt.connected) {
    try { await connect(); log('reconnected'); return; } catch (e) { await sleep(3000); }
  }
}

$('start').onclick = async () => {
  unlockAudio(); keepAwake();
  if (!navigator.bluetooth) {
    $('msg').textContent = 'This browser has no Bluetooth. On iPhone open this page in the Bluefy app.';
    return;
  }
  try {
    device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'NetAlert' }], optionalServices: [SVC] });
    device.addEventListener('gattserverdisconnected', () => { log('Bluetooth link dropped, reconnecting'); reconnectLoop(); });
    await connect();
    $('msg').textContent = '';
    $('start').textContent = 'Connected';
    $('start').disabled = true;
    log('connected to ' + device.name);
  } catch (err) {
    $('msg').textContent = 'Could not connect: ' + err.message;
  }
};

// ---- Simulation: sensor 1 goes quiet, captures, then falls silent (lost-signal alarm) ----
$('sim').onclick = () => {
  unlockAudio();
  log('SIMULATION: no radio in use');
  let beat = 0;
  const t = setInterval(() => {
    beat++;
    const captured = beat >= 3 && beat <= 6;
    onPacket({ id: 1, captured, armed: true, heartbeat: beat, captures: beat >= 3 ? 1 : 0, peak: captured ? 9.7 : 0,
               activity: captured ? 6 + Math.random() * 4 : 0.05 + Math.random() * 0.1 });
    if (beat === 8) clearInterval(t);
  }, 1000);
};
</script>
</body>
</html>
