<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1418">
<title>NetAlert</title>
<style>
  :root {
    --bg: #0e1418; --surface: #172028; --surface-2: #1f2a34; --line: #2b3945;
    --fg: #eaf0f4; --muted: #8fa1ae;
    --ok: #34c77b; --bad: #ff5a5f; --warn: #f5a524; --info: #4f9dff; --accent: #3b82f6;
    --radius: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f5f8; --surface: #ffffff; --surface-2: #e9eef3; --line: #d3dce4;
      --fg: #14202a; --muted: #5d6f7d;
      --ok: #1a9e5c; --bad: #d6343a; --warn: #c27c00; --info: #2563eb; --accent: #2563eb;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--fg); background: var(--bg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             calc(110px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    max-width: 560px; margin-inline: auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 22px; letter-spacing: .2px; margin: 0; }
  .pill { font-size: 13px; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .pill.on { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .pill.wait { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }

  .hero { border-radius: var(--radius); padding: 22px 18px; margin-bottom: 14px; background: var(--surface);
          border: 1px solid var(--line); text-align: center; }
  .hero .title { font-size: 28px; font-weight: 700; }
  .hero .sub { color: var(--muted); margin-top: 4px; }
  .hero.ok   { background: color-mix(in srgb, var(--ok) 14%, var(--surface));   border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
  .hero.ok .title { color: var(--ok); }
  .hero.bad  { background: color-mix(in srgb, var(--bad) 20%, var(--surface));  border-color: var(--bad); }
  .hero.bad .title { color: var(--bad); }
  .hero.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); border-color: var(--warn); }
  .hero.warn .title { color: var(--warn); }
  .hero.info .title { color: var(--info); }

  /* The alarm is visual only: the whole screen blinks red (about 1.2 flashes per second). */
  body.alarm::before { content: ""; position: fixed; inset: 0; z-index: 5; pointer-events: none; background: var(--bad);
                       animation: blink .8s infinite; }
  @keyframes blink { 0%, 49% { opacity: 0; } 50%, 100% { opacity: .55; } }

  .btn { font: inherit; font-weight: 600; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line);
         background: var(--surface); color: var(--fg); width: 100%; cursor: pointer; margin-top: 10px; }
  .btn:active { transform: scale(.985); }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; font-size: 17px; min-height: 54px; margin-top: 0; }
  .btn:disabled { opacity: .55; }
  #msg { color: var(--warn); margin: 0 0 10px; }
  #msg:empty { display: none; }
  .gap { height: 14px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 10px;
          margin-bottom: 12px; border-left: 5px solid var(--ok); }
  .card.bad { border-left-color: var(--bad); } .card.warn { border-left-color: var(--warn); } .card.info { border-left-color: var(--info); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .card-head b { font-size: 18px; }
  .badge { font-size: 13px; font-weight: 700; }
  .badge.ok { color: var(--ok); } .badge.bad { color: var(--bad); } .badge.warn { color: var(--warn); } .badge.info { color: var(--info); }
  .meta { color: var(--muted); font-size: 14px; }
  canvas.chart { width: 100%; height: 140px; display: block; margin-top: 8px; }

  details.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; }
  details.panel summary { list-style: none; cursor: pointer; padding: 14px; font-weight: 600; display: flex; justify-content: space-between; }
  details.panel summary::-webkit-details-marker { display: none; }
  details.panel summary::after { content: "›"; color: var(--muted); transition: transform .15s; font-size: 20px; line-height: 1; }
  details.panel[open] summary::after { transform: rotate(90deg); }
  .panel-body { padding: 0 14px 14px; }
  .panel-body label { display: flex; justify-content: space-between; margin: 12px 0 4px; }
  .panel-body label span { font-weight: 700; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 32px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  #log { font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); white-space: pre-wrap; max-height: 34vh; overflow: auto; }

  .alarmbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bad); color: #fff;
              padding: 14px max(16px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
              display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -6px 24px rgba(0,0,0,.4); }
  .alarmbar[hidden] { display: none; }
  .alarmbar .text { font-weight: 700; }
  .alarmbar button { background: #fff; color: var(--bad); border: 0; border-radius: 12px; min-height: 56px; font: inherit; font-weight: 800; font-size: 19px; }
</style>
</head>
<body>
<header>
  <h1>NetAlert</h1>
  <span id="link" class="pill">Not connected</span>
</header>

<section id="hero" class="hero"><div class="title" id="heroTitle"></div><div class="sub" id="heroSub"></div></section>
<p id="msg" role="status"></p>

<button id="start" class="btn primary">Start listening</button>
<button id="sim" class="btn">Simulate a sensor</button>
<div class="gap"></div>

<div id="cards"></div>

<details class="panel">
  <summary><span>Sensitivity</span></summary>
  <div class="panel-body">
    <label>Movement size to count <span id="thrval"></span></label>
    <input type="range" id="thr" min="0.3" max="5" step="0.1" aria-label="Movement size threshold">
    <label>Must last at least <span id="durval"></span></label>
    <input type="range" id="dur" min="0.1" max="1.5" step="0.05" aria-label="Minimum duration">
    <div class="hint">Lower is more sensitive. The sensor only streams movement; this app decides what counts as a capture. Saved on this phone.</div>
  </div>
</details>

<details class="panel">
  <summary><span>Event log</span></summary>
  <div class="panel-body"><div id="log"></div></div>
</details>

<div id="alarmbar" class="alarmbar" hidden>
  <div class="text" id="alarmtext"></div>
  <button id="silence">Stop alarm</button>
</div>

<script>
'use strict';

// ===== Constants =====
// Sensor protocol (must match firmware/src/main.c): 20-byte notifications,
// [0] sensor id, [1] sequence, [2..19] three samples of x,y,z int16 LE in 0.01 m/s².
const SVC = '4e41ff00-9d11-4c7f-8a1b-5c7d2e6f0001';
const CHR = '4e41ff01-9d11-4c7f-8a1b-5c7d2e6f0001';
const SAMPLE_HZ = 52;
const SAMPLES_PER_PACKET = 3;

// Detection (all decided here, not on the sensor).
const ARM_DELAY_S = 30;        // time to hang the sensor and walk away before it can trigger
const BASELINE_ALPHA = 0.004;  // ~5 s time constant at 52 Hz: absorbs tilt, passes ~1 Hz sway
const WINDOW_S = 3;            // look-back window for activity
const CAPTURE_HOLD_S = 60;     // stay in "capture" this long after the last movement
const LOST_AFTER_S = 5;        // data arrives ~17 times a second; 5 s of nothing is a real problem
const CHART_WINDOW_S = 300;    // chart shows the last 5 minutes
const DEFAULT_CFG = { thr: 1.0, dur: 0.2 };   // m/s² and seconds

// ===== State =====
const $ = (id) => document.getElementById(id);
const sensors = new Map();     // id -> sensor (see newSensor)
let device = null, reconnecting = false, wakeLock = null;
let alarmActive = false, alarmText = '', threshold = DEFAULT_CFG.thr, minSamples = Math.round(DEFAULT_CFG.dur * SAMPLE_HZ);

function log(msg) {
  $('log').textContent = `${new Date().toLocaleTimeString()}  ${msg}\n` + $('log').textContent;
}
function setMsg(t) { $('msg').textContent = t; }

// ===== Packet =====
function parse(dv) {
  if (dv.byteLength < 2 + 6) return null;
  const samples = [];
  for (let o = 2; o + 6 <= dv.byteLength; o += 6) {
    samples.push([dv.getInt16(o, true) / 100, dv.getInt16(o + 2, true) / 100, dv.getInt16(o + 4, true) / 100]);
  }
  return { id: dv.getUint8(0), seq: dv.getUint8(1), samples };
}

// ===== Detector: per-sensor state, one sample at a time =====
function newSensor(id) {
  return {
    id, base: null, n: 0, ring: new Uint8Array(WINDOW_S * SAMPLE_HZ), head: 0, active: 0,
    secMax: 0, hist: [], seen: Date.now(), lost: false, lastSeq: null, dropped: 0,
    captured: false, captures: 0, peak: 0, lastActiveAt: 0,
  };
}

function getSensor(id) {
  let s = sensors.get(id);
  if (!s) { s = newSensor(id); sensors.set(id, s); log(`sensor ${id} found, arming for ${ARM_DELAY_S} s`); }
  return s;
}

const isArmed = (s) => s.n >= ARM_DELAY_S * SAMPLE_HZ;

function processSample(s, [x, y, z], now) {
  if (!s.base) s.base = [x, y, z];
  // Distance of the acceleration vector from its slow-moving baseline. Per axis, so a horizontal
  // sway counts (|a| alone barely changes then); slow tilts are absorbed by the baseline.
  const d = [x - s.base[0], y - s.base[1], z - s.base[2]];
  const dev = Math.hypot(...d);
  for (let i = 0; i < 3; i++) s.base[i] += BASELINE_ALPHA * d[i];
  s.n++;
  if (dev > s.secMax) s.secMax = dev;

  const armed = isArmed(s);
  const active = armed && dev > threshold ? 1 : 0;
  s.active += active - s.ring[s.head];
  s.ring[s.head] = active;
  s.head = (s.head + 1) % s.ring.length;

  if (active) { s.lastActiveAt = now; if (dev > s.peak) s.peak = dev; }
  if (armed && s.active >= minSamples) {
    if (!s.captured) {
      s.captured = true; s.captures++;
      raiseAlarm(`CAPTURE on net ${s.id}. Peak ${s.peak.toFixed(1)} m/s²`);
    }
  } else if (s.captured && now - s.lastActiveAt > CAPTURE_HOLD_S * 1000) {
    s.captured = false; s.peak = 0;
  }

  if (s.n % SAMPLE_HZ === 0) {                     // once per second: one chart point
    s.hist.push({ t: now, v: s.secMax, cap: s.captured });
    s.secMax = 0;
    while (s.hist.length && now - s.hist[0].t > CHART_WINDOW_S * 1000) s.hist.shift();
  }
}

function onPacket(p) {
  const s = getSensor(p.id), now = Date.now();
  if (s.lastSeq !== null) s.dropped += (p.seq - s.lastSeq - 1) & 0xFF;
  s.lastSeq = p.seq; s.seen = now;
  if (s.lost) { s.lost = false; log(`sensor ${p.id} back in range`); }
  for (const sample of p.samples) processSample(s, sample, now);
  render();
}

setInterval(() => {
  const now = Date.now();
  for (const s of sensors.values()) {
    if (!s.lost && now - s.seen > LOST_AFTER_S * 1000) {
      s.lost = true;
      raiseAlarm(`Net ${s.id} signal lost: out of range or dead battery`);
    }
  }
}, 1000);

// ===== Alarm: the screen blinks red until you tap Stop alarm =====
function raiseAlarm(msg) {
  log('!!! ' + msg);
  alarmActive = true; alarmText = msg;
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  render();
}
$('silence').onclick = () => { alarmActive = false; log('alarm stopped'); render(); };

// ===== Rendering =====
function sensorView(s) {
  if (s.lost) return { tone: 'warn', label: 'Signal lost' };
  if (s.captured) return { tone: 'bad', label: 'Capture' };
  if (!isArmed(s)) return { tone: 'info', label: 'Arming…' };
  return { tone: 'ok', label: 'Armed' };
}

function renderHero() {
  const views = [...sensors.values()].map((s) => ({ s, ...sensorView(s) }));
  const worst = ['bad', 'warn', 'info'].map((t) => views.find((v) => v.tone === t)).find(Boolean);
  let tone = 'idle', title = 'Not listening', sub = 'Tap Start listening to connect to a sensor';
  if (worst) {
    const { s } = worst; tone = worst.tone;
    title = { bad: 'CAPTURE', warn: 'Signal lost', info: 'Arming…' }[tone];
    sub = tone === 'bad' ? `Net ${s.id} · peak ${s.peak.toFixed(1)} m/s²`
        : tone === 'warn' ? `Net ${s.id} has not been heard for ${Math.round((Date.now() - s.seen) / 1000)} s`
        : `Net ${s.id} arms in ${Math.max(0, Math.ceil(ARM_DELAY_S - s.n / SAMPLE_HZ))} s`;
  } else if (views.length) {
    tone = 'ok'; title = 'All quiet'; sub = `${views.length} sensor${views.length > 1 ? 's' : ''} armed`;
  } else if (device) {
    sub = 'Waiting for the first reading…';
  }
  $('hero').className = 'hero ' + tone;
  $('heroTitle').textContent = title; $('heroSub').textContent = sub;
}

function renderLink() {
  const up = device && device.gatt.connected, link = $('link');
  link.className = 'pill ' + (up ? 'on' : reconnecting ? 'wait' : '');
  link.textContent = up ? 'Connected' : reconnecting ? 'Reconnecting…' : 'Not connected';
}

function render() {
  renderHero(); renderLink();
  document.body.classList.toggle('alarm', alarmActive);
  $('alarmbar').hidden = !alarmActive;
  $('alarmtext').textContent = alarmText;

  const cards = $('cards');
  cards.textContent = '';
  for (const s of [...sensors.values()].sort((a, b) => a.id - b.id)) {
    const v = sensorView(s), age = Math.round((Date.now() - s.seen) / 1000);
    const card = document.createElement('div');
    card.className = 'card ' + (v.tone === 'ok' ? '' : v.tone);
    card.innerHTML = `<div class="card-head"><b>Net ${s.id}</b><span class="badge ${v.tone}">${v.label}</span></div>` +
      `<div class="meta">Last reading ${age} s ago · captures ${s.captures}${s.dropped ? ' · ' + s.dropped + ' packets lost' : ''}</div>`;
    cards.appendChild(card);
    if (s.hist.length) {
      const c = document.createElement('canvas'); c.className = 'chart'; card.appendChild(c);
      drawChart(c, s.hist);
    }
  }
}
setInterval(render, 1000);

// ===== Movement chart: max movement per second over the last 5 minutes =====
function drawChart(canvas, hist) {
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const color = (n) => css.getPropertyValue(n).trim();
  const muted = color('--muted'), ok = color('--ok'), bad = color('--bad'), warn = color('--warn'), line = color('--line');
  const now = Date.now(), padL = 30, padR = 4, padT = 6, padB = 18, pw = w - padL - padR, ph = h - padT - padB;
  const ymax = Math.max(3, Math.ceil(Math.max(threshold * 1.3, ...hist.map((q) => q.v)) * 1.1));
  const X = (t) => padL + pw * (1 - (now - t) / (CHART_WINDOW_S * 1000));
  const Y = (v) => padT + ph * (1 - v / ymax);

  g.font = '11px -apple-system, system-ui, sans-serif'; g.fillStyle = muted; g.textBaseline = 'middle';
  for (const v of [0, ymax / 2, ymax]) {                      // horizontal grid + labels
    g.strokeStyle = line; g.lineWidth = 1; g.beginPath(); g.moveTo(padL, Y(v)); g.lineTo(w - padR, Y(v)); g.stroke();
    g.fillText(Number.isInteger(v) ? v : v.toFixed(1), 2, Y(v));
  }
  g.textBaseline = 'alphabetic'; g.fillText('−5 min', padL, h - 3); g.textAlign = 'right'; g.fillText('now', w - padR, h - 3); g.textAlign = 'left';

  g.fillStyle = bad; g.globalAlpha = 0.16;                    // capture periods
  hist.forEach((q, i) => { if (q.cap) { const x0 = X(q.t), x1 = i + 1 < hist.length ? X(hist[i + 1].t) : w - padR; g.fillRect(x0, padT, Math.max(2, x1 - x0), ph); } });
  g.globalAlpha = 1;

  g.strokeStyle = warn; g.lineWidth = 1.2; g.setLineDash([5, 4]);   // threshold
  g.beginPath(); g.moveTo(padL, Y(threshold)); g.lineTo(w - padR, Y(threshold)); g.stroke(); g.setLineDash([]);
  g.fillStyle = warn; g.textAlign = 'right'; g.fillText(`limit ${threshold.toFixed(1)}`, w - padR, Math.max(padT + 10, Y(threshold) - 5)); g.textAlign = 'left';

  const segs = [[]];                                          // a gap longer than 3 s means no signal
  hist.forEach((q, i) => { if (i && q.t - hist[i - 1].t > 3000) segs.push([]); segs[segs.length - 1].push(q); });
  for (const seg of segs) {
    const fill = g.createLinearGradient(0, padT, 0, padT + ph); fill.addColorStop(0, ok + '66'); fill.addColorStop(1, ok + '00');
    g.beginPath(); seg.forEach((q, i) => (i ? g.lineTo(X(q.t), Y(q.v)) : g.moveTo(X(q.t), Y(q.v))));
    g.strokeStyle = ok; g.lineWidth = 1.8; g.lineJoin = 'round'; g.stroke();
    g.lineTo(X(seg[seg.length - 1].t), Y(0)); g.lineTo(X(seg[0].t), Y(0)); g.closePath(); g.fillStyle = fill; g.fill();
  }
}

// ===== Sensitivity: kept on this phone, applied by the detector above =====
function loadCfg() { try { return JSON.parse(localStorage.getItem('na-cfg')); } catch (e) { return null; } }
function saveCfg(c) { try { localStorage.setItem('na-cfg', JSON.stringify(c)); } catch (e) { /* storage is optional */ } }

function applyCfg(thr, dur) {
  threshold = thr; minSamples = Math.max(1, Math.round(dur * SAMPLE_HZ));
  $('thr').value = thr; $('dur').value = dur;
  $('thrval').textContent = thr.toFixed(1) + ' m/s²';
  $('durval').textContent = dur.toFixed(2) + ' s';
}
function onSlide() {
  const c = { thr: parseFloat($('thr').value), dur: parseFloat($('dur').value) };
  applyCfg(c.thr, c.dur); saveCfg(c); render();
}
$('thr').oninput = onSlide; $('dur').oninput = onSlide;
{ const c = loadCfg() || DEFAULT_CFG; applyCfg(c.thr, c.dur); }

// ===== Bluetooth: connect, subscribe, reconnect =====
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function connect() {
  const server = await device.gatt.connect();
  const chr = await (await server.getPrimaryService(SVC)).getCharacteristic(CHR);
  chr.addEventListener('characteristicvaluechanged', (e) => { const p = parse(e.target.value); if (p) onPacket(p); });
  await chr.startNotifications();
}

async function reconnectLoop() {
  reconnecting = true; render();
  while (device && !device.gatt.connected) {
    try { await connect(); log('reconnected'); break; } catch (e) { await sleep(3000); }
  }
  reconnecting = false; render();
}

async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* optional */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeLock) keepAwake(); });

$('start').onclick = async () => {
  keepAwake();
  if (!navigator.bluetooth) { setMsg('This browser has no Bluetooth. On iPhone open this page in the Bluefy app.'); return; }
  try {
    device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'NetAlert' }], optionalServices: [SVC] });
    device.addEventListener('gattserverdisconnected', () => { log('Bluetooth link dropped, reconnecting'); reconnectLoop(); });
    await connect();
    setMsg('');
    $('start').textContent = 'Listening'; $('start').disabled = true;
    log('connected to ' + device.name);
    render();
  } catch (err) {
    setMsg('Could not connect: ' + err.message);
  }
};

// ===== Simulation: a sensor rests, gets shaken, rests, then falls silent (exercises both alarms) =====
$('sim').onclick = () => {
  log('SIMULATION: no radio in use');
  const s = getSensor(1);
  s.n = Math.max(s.n, ARM_DELAY_S * SAMPLE_HZ - 2 * SAMPLE_HZ);   // skip most of the arming wait
  let t = 0, seq = 0;
  const timer = setInterval(() => {
    const samples = [];
    for (let i = 0; i < SAMPLES_PER_PACKET; i++, t += 1 / SAMPLE_HZ) {
      const shake = t >= 5 && t < 8 ? 4 * Math.sin(2 * Math.PI * 3 * t) : 0;          // 3 Hz shake for 3 s
      samples.push([0.03 * Math.random() + shake, 0.03 * Math.random(), 9.8 + 0.03 * Math.random()]);
    }
    onPacket({ id: 1, seq: seq++ & 0xFF, samples });
    if (t >= 11) clearInterval(timer);                                                // then go silent
  }, 1000 * SAMPLES_PER_PACKET / SAMPLE_HZ);
};

render();
</script>
</body>
</html>
